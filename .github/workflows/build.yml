name: Build archive data

# 當你新增或修改章節、meta.json 時，自動執行 build.js
# 並把產生的 info.json / books.json / announcements.json 提交回倉庫
on:
  push:
    paths:
      - "novels/**/chapters/**"
      - "novels/**/meta.json"
  workflow_dispatch:   # 也可以在 GitHub 的 Actions 頁面手動執行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Taipei   # 讓「更新日期」使用台灣時間
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run build.js
        run: node build.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "沒有需要更新的檔案"
          else
            git commit -m "chore: auto build archive data"
            git push
          fi
