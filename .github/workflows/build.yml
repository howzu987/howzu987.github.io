{
 "name": "Build archive data",
 "on": {
  "push": {
   "paths": [
    "novels/**/chapters/**",
    "novels/**/meta.json"
   ]
  },
  "workflow_dispatch": {}
 },
 "permissions": {
  "contents": "write"
 },
 "jobs": {
  "build": {
   "runs-on": "ubuntu-latest",
   "env": {
    "TZ": "Asia/Taipei"
   },
   "steps": [
    {
     "uses": "actions/checkout@v4"
    },
    {
     "uses": "actions/setup-node@v4",
     "with": {
      "node-version": 20
     }
    },
    {
     "name": "Run build.js",
     "run": "node build.js"
    },
    {
     "name": "Commit generated files",
     "run": "git config user.name \"github-actions[bot]\"\ngit config user.email \"41898282+github-actions[bot]@users.noreply.github.com\"\ngit add -A\nif git diff --cached --quiet; then echo no-changes; else git commit -m \"chore: auto build archive data\" && git push; fi\n"
    }
   ]
  }
 }
}
