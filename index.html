<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCHIVE // 00</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 頂部極簡導覽列 -->
    <header class="navbar">
        <div class="nav-brand">
            <a href="index.html">ARCHIVE // 00</a>
        </div>
        <nav class="nav-links">
            <a href="index.html" class="active">HOME <span class="zh-sub">首頁</span></a>
            <a href="works.html">WORKS <span class="zh-sub">作品</span></a>
            <a href="about.html">ABOUT <span class="zh-sub">關於</span></a>
        </nav>
    </header>

    <main class="container">

        <!-- 主視覺 + 隨機抽一篇 -->
        <section class="home-hero">
            <div class="system-tag">SYSTEM ONLINE // WELCOME</div>
            <h1 class="main-title">ARCHIVE // 00</h1>
            <p class="subtitle">隨心落筆，創造一個屬於我的世界</p>
            <div class="hero-actions">
                <a href="works.html" class="btn-enter">ENTER WORKS <span class="arrow">→</span></a>
                <button id="random-btn" class="btn-enter" type="button" disabled>RANDOM FILE <span class="arrow">⟳</span></button>
            </div>
        </section>

        <!-- 繼續閱讀（有閱讀紀錄才會顯示） -->
        <section id="continue-section" class="home-section" hidden>
            <h2 class="section-heading">CONTINUE <span class="zh">繼續閱讀</span></h2>
            <a id="continue-link" href="#" class="chapter-item">
                <span class="ch-num" id="continue-num"></span>
                <span class="ch-title" id="continue-title"></span>
                <span class="ch-action">RESUME →</span>
            </a>
        </section>

        <!-- 最新更新 -->
        <section class="home-section">
            <h2 class="section-heading">LATEST <span class="zh">最新更新</span></h2>
            <div id="latest-grid" class="works-grid">
                <p class="loading-text">LOADING...</p>
            </div>
        </section>

        <!-- 系統公告 -->
        <section class="home-section">
            <h2 class="section-heading">SYSTEM LOG <span class="zh">系統公告</span></h2>
            <ul id="log-list" class="log-list">
                <li class="log-empty">LOADING...</li>
            </ul>
        </section>

    </main>

    <!-- 底部極簡資訊 -->
    <footer class="footer">
        <p>© 2026 MY ARCHIVE. ALL RIGHTS RESERVED.</p>
    </footer>

    <script src="home.js"></script>
</body>
</html>
